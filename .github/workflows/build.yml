name: Build recovery

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.flavor }} (${{ matrix.manifest }})
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: twrp
            manifest: twrp-14.1
          - flavor: orangefox
            manifest: fox_16.0
    env:
      FLAVOR: ${{ matrix.flavor }}
      MANIFEST_BRANCH: ${{ matrix.manifest }}
      WORK: /mnt/work
    steps:
      - name: Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /usr/share/miniconda
          sudo docker image prune --all --force > /dev/null || true
          sudo apt-get -qq remove --purge '^llvm-.*' '^mysql-.*' '^php.*' 'google-chrome-stable' 'firefox' \
            'microsoft-edge-stable' 'azure-cli' 'powershell' > /dev/null 2>&1 || true
          sudo apt-get -qq autoremove > /dev/null 2>&1 || true
          sudo mkdir -p "$WORK"
          sudo chown "$USER:$USER" "$WORK"
          sudo swapoff -a || true
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile > /dev/null
          sudo swapon /mnt/swapfile
          df -h / /mnt
          free -h

      - name: Check out device tree
        uses: actions/checkout@v4
        with:
          path: tree

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y bc bison build-essential ccache cpio curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf lib32z1-dev libc6-dev-i386 libelf-dev libgl1-mesa-dev libssl-dev \
            libxml2-utils lz4 python-is-python3 python3 rsync unzip x11proto-core-dev xsltproc zip zlib1g-dev
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global color.ui false

      - name: Sync and build
        run: tree/.github/scripts/build.sh

      - name: Validate against stock vendor_boot
        run: |
          img="$WORK/src/out/target/product/mblu21/vendor_boot.img"
          mkdir -p dist
          python3 tree/tools/vendor_boot_check.py "$img" \
            --reference tree/prebuilt/stock_vendor_boot.json \
            --flavor "$FLAVOR" \
            --rom-fstab tree/prebuilt/fstab.rom.ums9230_6h10 \
            --report dist/validation.json | tee dist/validation.txt

      - name: Package
        id: package
        run: |
          short="$(git -C tree rev-parse --short=12 HEAD)"
          stamp="$(date -u +%Y%m%d)"
          name="mblu21-${FLAVOR}-${MANIFEST_BRANCH}-${stamp}-${short}-UNTESTED-vendor_boot.img"
          cp "$WORK/src/out/target/product/mblu21/vendor_boot.img" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          for zip in "$WORK"/src/out/target/product/mblu21/OrangeFox*.zip; do
            [ -f "$zip" ] || continue
            base="$(basename "$zip" .zip)"
            cp "$zip" "dist/${base}-UNTESTED.zip"
            (cd dist && sha256sum "${base}-UNTESTED.zip" > "${base}-UNTESTED.zip.sha256")
          done
          echo "tag=${FLAVOR}-${stamp}-${short}-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "title=${FLAVOR} ${MANIFEST_BRANCH} ${stamp} (${short}) UNTESTED" >> "$GITHUB_OUTPUT"
          ls -l dist
          cat dist/*.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mblu21-${{ matrix.flavor }}
          path: dist/
          retention-days: 30

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "**UNTESTED.** Built by CI and checked only statically; nobody has booted this on a phone yet."
            echo
            echo "This image replaces the whole \`vendor_boot\` partition. Read the README before flashing:"
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/README.md"
            echo
            echo "Source: ${GITHUB_SHA} · manifest \`${MANIFEST_BRANCH}\` · run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '### SHA-256'
            echo '```'
            cat dist/*.sha256
            echo '```'
            echo
            echo '### Static check against stock vendor_boot'
            echo '```'
            cat dist/validation.txt
            echo '```'
          } > dist/notes.md
          gh release create "${{ steps.package.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "${{ steps.package.outputs.title }}" \
            --notes-file dist/notes.md \
            dist/*.img dist/*.sha256 dist/validation.json $(ls dist/*.zip 2>/dev/null)
