name: Build recovery

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.flavor }} (${{ matrix.manifest }})
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: orangefox
            manifest: fox_16.0
          - flavor: shrp
            manifest: shrp-12.1
    env:
      FLAVOR: ${{ matrix.flavor }}
      MANIFEST_BRANCH: ${{ matrix.manifest }}
      WORK: /mnt/work
    steps:
      - name: Check out device tree
        uses: actions/checkout@v4
        with:
          path: tree
          persist-credentials: false

      - name: Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /usr/share/miniconda
          sudo docker image prune --all --force > /dev/null || true
          sudo apt-get -qq remove --purge '^llvm-.*' '^mysql-.*' '^php.*' 'google-chrome-stable' 'firefox' \
            'microsoft-edge-stable' 'azure-cli' 'powershell' > /dev/null 2>&1 || true
          sudo apt-get -qq autoremove > /dev/null 2>&1 || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          tree/.github/scripts/work-space.sh
          sudo fallocate -l 12G "$WORK/swapfile"
          sudo chmod 600 "$WORK/swapfile"
          sudo mkswap "$WORK/swapfile" > /dev/null
          sudo swapon -p 0 "$WORK/swapfile"
          if sudo modprobe zram 2>/dev/null; then
            echo zstd | sudo tee /sys/block/zram0/comp_algorithm > /dev/null || true
            echo 12G | sudo tee /sys/block/zram0/disksize > /dev/null
            sudo mkswap /dev/zram0 > /dev/null
            sudo swapon -p 100 /dev/zram0
          fi
          swapon --show
          df -h / /mnt
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y bc bison build-essential cpio curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf lib32z1-dev libc6-dev-i386 libelf-dev libgl1-mesa-dev libssl-dev \
            libxml2-utils lz4 python-is-python3 python3 repo rsync unzip x11proto-core-dev xsltproc zip zlib1g-dev
          mkdir -p "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          repo --version
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global color.ui false

      - name: Sync and build
        run: tree/.github/scripts/build.sh

      - name: Reseal with the stock Meizu AVB blob
        run: |
          img="$WORK/src/out/target/product/mblu21/vendor_boot.img"
          mkdir -p dist
          python3 tree/tools/reseal_stock_avb.py \
            --image "$img" \
            --stock-vbmeta tree/prebuilt/vendor_boot.avb.vbmeta \
            --output "$img.resealed" \
            --report dist/avb-reseal.txt | tee -a dist/validation.txt
          mv "$img.resealed" "$img"

      - name: Validate against stock vendor_boot
        id: validate
        run: |
          img="$WORK/src/out/target/product/mblu21/vendor_boot.img"
          mkdir -p dist
          python3 tree/tools/vendor_boot_check.py "$img" \
            --reference tree/prebuilt/stock_vendor_boot.json \
            --flavor "$FLAVOR" \
            --rom-fstab tree/prebuilt/fstab.rom.ums9230_6h10 \
            $(ls "$WORK"/src/out/target/product/mblu21/OrangeFox*.zip 2>/dev/null | sed 's/^/--zip /') \
            --report dist/validation.json | tee dist/validation.txt

      - name: Keep image that failed validation
        if: failure() && steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failed-${{ matrix.flavor }}
          path: |
            ${{ env.WORK }}/src/out/target/product/mblu21/vendor_boot.img
            dist/
          retention-days: 7

      - name: Package
        run: |
          short="$(git -C tree rev-parse --short=12 HEAD)"
          stamp="$(date -u +%Y%m%d)"
          name="mblu21-${FLAVOR}-${MANIFEST_BRANCH}-${stamp}-${short}-UNTESTED-vendor_boot.img"
          cp "$WORK/src/out/target/product/mblu21/vendor_boot.img" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          for zip in "$WORK"/src/out/target/product/mblu21/OrangeFox*.zip; do
            [ -f "$zip" ] || continue
            base="$(basename "$zip" .zip)"
            cp "$zip" "dist/${base}-UNTESTED.zip"
            (cd dist && sha256sum "${base}-UNTESTED.zip" > "${base}-UNTESTED.zip.sha256")
          done
          cp "$WORK/manifest-pinned.xml" "dist/mblu21-${FLAVOR}-${MANIFEST_BRANCH}-${stamp}-${short}-manifest.xml"
          echo "${FLAVOR}-${stamp}-${short}-r${GITHUB_RUN_NUMBER}" > dist/release-tag
          echo "${FLAVOR} ${MANIFEST_BRANCH} ${stamp} (${short}) UNTESTED" > dist/release-title
          {
            echo "**UNTESTED.** Built by CI and checked only statically; nobody has booted this on a phone yet."
            echo
            echo "This image replaces the whole \`vendor_boot\` partition. Read the README before flashing:"
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/README.md"
            echo
            echo "Source: ${GITHUB_SHA} · manifest \`${MANIFEST_BRANCH}\` · run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Pinned revisions of every synced project: \`$(basename dist/*-manifest.xml)\`."
            echo
            echo '### SHA-256'
            echo '```'
            cat dist/*.sha256
            echo '```'
            echo
            echo '### Static check against stock vendor_boot'
            echo '```'
            cat dist/validation.txt
            echo '```'
          } > dist/notes.md
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mblu21-${{ matrix.flavor }}
          path: dist/
          retention-days: 30

  publish:
    name: Publish pre-releases
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mblu21-*
          path: dist

      - name: Create releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          published=0
          for dir in dist/mblu21-*/; do
            gh release create "$(cat "$dir/release-tag")" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "$(cat "$dir/release-title")" \
              --notes-file "$dir/notes.md" \
              "$dir"/*.img "$dir"/*.sha256 "$dir"/validation.json "$dir"/*-manifest.xml "$dir"/*.zip
            published=$((published + 1))
          done
          echo "published $published release(s)"
          [ "$published" -gt 0 ]
